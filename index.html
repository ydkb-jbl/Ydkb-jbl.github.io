<!DOCTYPE html>
<html lang="tr">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* TEMEL DEĞİŞKENLER */
        :root {
            --cover-bg: #1c0202;
            --cover-dark: #050000;
            --gold: #d4af37;
            
            --parchment: #e4d1b9;
            --parchment-dark: #b89870;
            --ink: #1a1008;
            --blood: #820000;
            
            --uv-glow: #00ffff;
            --uv-blood: #ff0055;
            
            --mouse-x: 50vw;
            --mouse-y: 50vh;
        }

        body {
            background-color: #030303;
            color: var(--ink);
            overflow-x: hidden;
            font-family: 'Playfair Display', serif;
            margin: 0;
            transition: background-color 0.5s;
        }

        /* TİPOGRAFİ */
        h1, h2, h3, .mystic-title { font-family: 'Cinzel Decorative', serif; }
        .typewriter { font-family: 'Special Elite', monospace; }
        .creep { font-family: 'Creepster', cursive; }

        /* KANVAS PARTİKÜLLERİ */
        #dust-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 1; mix-blend-mode: screen;
        }

        /* KAPAK (COVER) */
        #cover {
            background: radial-gradient(circle, var(--cover-bg) 0%, var(--cover-dark) 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
            border-left: 50px solid #000;
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.5s ease-in-out, transform 2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 1.5s ease;
        }
        #cover::after {
            content: ''; position: absolute; inset: 0;
            background: url('https://www.transparenttextures.com/patterns/black-scales.png');
            opacity: 0.3; pointer-events: none;
        }
        .golden-hand {
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)) drop-shadow(0 0 5px #000);
            transition: all 0.5s ease; cursor: pointer;
        }
        .golden-hand:hover {
            filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.9)) drop-shadow(0 0 15px #ffeb73);
            transform: scale(1.05);
        }

        /* GÜNLÜK İÇERİĞİ */
        #journal-wrapper {
            position: relative; min-height: 100vh;
            background-color: var(--parchment);
            background-image: 
                radial-gradient(circle, transparent 10%, var(--parchment-dark) 150%),
                url('https://www.transparenttextures.com/patterns/aged-paper.png');
            box-shadow: inset 0 0 100px rgba(50, 30, 10, 0.8);
            border: 2px solid #5a3c1c; display: none; opacity: 0; transition: opacity 1.5s ease; z-index: 10;
        }
        #normal-layer { position: relative; z-index: 11; padding: 4rem 2rem 8rem 2rem; max-width: 1400px; margin: 0 auto; }

        /* UV KARANLIK OVERLAY */
        #uv-darkness {
            position: fixed; inset: 0; background: rgba(5, 0, 15, 0.95);
            pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.4s ease;
            mix-blend-mode: multiply;
        }
        body.uv-active #uv-darkness { 
            opacity: 1; 
            /* El feneri etkisini artırmak için arka planda gerçek bir karanlık ve ışık halkası */
            background: radial-gradient(circle 300px at var(--mouse-x) var(--mouse-y), rgba(5, 0, 15, 0.4) 0%, rgba(5, 0, 15, 0.98) 80%);
        }

        /* UV GİZLİ YAZILAR (Sadece Fener Altında Görünür) */
        .uv-text {
            position: absolute; font-family: 'Creepster', cursive;
            opacity: 0; pointer-events: none; z-index: 45; transition: opacity 0.3s;
            text-transform: uppercase; text-align: center; line-height: 1.1;
        }
        .uv-text.glow { color: #d4ffff; text-shadow: 0 0 10px var(--uv-glow), 0 0 20px var(--uv-glow), 0 0 40px #0055ff; }
        .uv-text.blood { color: #ffb3c6; text-shadow: 0 0 10px var(--uv-blood), 0 0 20px var(--uv-blood), 0 0 40px #aa0000; }
        
        body.uv-active .uv-text {
            opacity: 1;
            /* Koordinatlar JS üzerinden elemente özel (--mask-x, --mask-y) olarak hesaplanacak */
            -webkit-mask-image: radial-gradient(circle 180px at var(--mask-x, -1000px) var(--mask-y, -1000px), black 10%, transparent 80%);
            mask-image: radial-gradient(circle 180px at var(--mask-x, -1000px) var(--mask-y, -1000px), black 10%, transparent 80%);
        }

        /* 3D TILT KARTLARI */
        .tilt-card {
            background: #faf7f2; padding: 15px 15px 40px 15px;
            box-shadow: 4px 10px 25px rgba(0,0,0,0.6); border: 1px solid #d4c5b0;
            position: relative; transform-style: preserve-3d; cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        /* UV Açıkken Tilt iptal edilir ki maskeleme hatasız çalışsın */
        body.uv-active .tilt-card { transform: none !important; box-shadow: none !important; }
        
        .tilt-card::before { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); pointer-events: none; }
        .polaroid-img {
            height: 220px; background: #111; display: flex; align-items: center; justify-content: center;
            border: 1px solid #777; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            transform: translateZ(30px);
        }
        .polaroid-title-wrap { transform: translateZ(20px); }
        .taped-corner {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%) rotate(-3deg) translateZ(40px);
            width: 110px; height: 35px; background: rgba(230, 225, 180, 0.8); box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 5;
        }

        /* BUTONLAR VE NAVİGASYON */
        .nav-arrow {
            position: fixed; top: 50%; transform: translateY(-50%);
            font-size: 4rem; color: rgba(30, 20, 10, 0.4); cursor: pointer; z-index: 60; transition: all 0.3s ease;
        }
        .nav-arrow:hover { color: var(--blood); text-shadow: 0 0 10px rgba(130,0,0,0.5); transform: translateY(-50%) scale(1.1); }
        body.uv-active .nav-arrow { color: rgba(0,255,255,0.3); }
        body.uv-active .nav-arrow:hover { color: var(--uv-glow); text-shadow: 0 0 20px var(--uv-glow); }
        #prev-btn { left: 30px; }
        #next-btn { right: 30px; }

        #uv-toggle {
            position: fixed; bottom: 40px; right: 40px; width: 70px; height: 70px; border-radius: 50%;
            background: radial-gradient(circle, #3b185f, #150529); border: 2px solid #8b5cf6; color: #d8b4fe; font-size: 2rem;
            cursor: pointer; z-index: 100; box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); transition: all 0.3s; display: none;
        }
        #uv-toggle:hover { transform: scale(1.1); box-shadow: 0 0 40px rgba(139, 92, 246, 0.8); }
        body.uv-active #uv-toggle { background: radial-gradient(circle, #00ffff, #0055ff); border-color: #fff; color: #000; box-shadow: 0 0 40px #00ffff; }

        /* YAN PANEL (MODAL) */
        #modal-overlay { backdrop-filter: blur(8px); }
        #modal {
            background-color: var(--parchment); background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            border-left: 12px solid #3a2210; box-shadow: -20px 0 60px rgba(0,0,0,1); transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1);
        }
        body.uv-active #modal { background: #0c0817; border-left-color: #00ffff; color: #b3a7c9; }
        
        /* KRİPTO TERMİNALİ */
        .crypto-machine {
            background: #111; border: 8px solid #2a1b10; border-radius: 8px; padding: 2.5rem;
            box-shadow: inset 0 0 60px #000, 0 20px 40px rgba(0,0,0,0.8); position: relative;
        }
        .crypto-machine::before { content: ''; position: absolute; inset: 0; background: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity: 0.1; pointer-events: none; }
        .crypto-input { background: #050505; color: #4ade80; border: 2px solid #22c55e; font-family: 'Special Elite', monospace; width: 100%; padding: 1.5rem; border-radius: 4px; outline: none; resize: none; font-size: 1.1rem; }
        .crypto-btn { background: linear-gradient(to bottom, #7f1d1d, #450a0a); color: #fecaca; border: 2px solid #b91c1c; padding: 1rem 2.5rem; font-family: 'Cinzel Decorative'; font-weight: bold; font-size: 1.3rem; cursor: pointer; transition: all 0.2s; }
        .crypto-btn:hover { box-shadow: 0 0 20px rgba(220, 38, 38, 0.6); }
        
        /* EFEKTLER & SCROLLBAR */
        .glitch-text { animation: glitch 1.5s infinite; }
        @keyframes glitch {
            0% { transform: translate(0) }
            10% { transform: translate(-3px, 2px); text-shadow: 2px 0 red, -2px 0 blue; }
            20% { transform: translate(3px, -2px); text-shadow: -2px 0 red, 2px 0 blue; }
            30% { transform: translate(0); text-shadow: none; }
            100% { transform: translate(0) }
        }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #3a2210; border-radius: 5px; }
        body.uv-active ::-webkit-scrollbar-thumb { background: #00ffff; }
    </style>
</head>

    <script>
        // ==========================================

        const journalData = [
            {
                type: 'grid',
                title: "Bölüm I: Karakterlerin Psikolojik Anatomisi (Temel Çember)",
                desc: "\"İnsan zihni, en büyük Lovecraftvari dehşettir. Panoptikon'un gözü her zaman kendi içimizedir.\"",
                items: [
                    {
                        name: 'Dipper Pines', type: 'Jungiyen Gölge & Kibir', icon: '<i class="fa-solid fa-tree text-6xl text-emerald-800"></i>', bgColor: '#0e1f11', rotation: -2,
                        content: `<p>Eski yazların naif maceraperesti, artık epistemolojik bir krizin tam merkezinde. Dipper'ın "gerçeği" bulmaya olan hastalıklı takıntısı (Hubris of intellect), onu sadece bilinmeyeni araştırmaya değil, evrensel dokunun karanlık bir parçası olmaya zorluyor.</p><p class="mt-4"><strong>Psikanalitik Yansıma:</strong> Bilgiyi elde etmek uğruna akıl sağlığını feda etme eğilimi, onda patolojik bir yaşayış biçimi haline gelmiştir. Amcası Ford'un trajik izinden gitmesi, Nietzsche'nin 'Bengi Dönüş' (Eternal Return) kavramının mükemmel bir tezahürüdür.</p>`,

                    },
                    {
                        name: 'Mabel Pines', type: 'Absürdizm & Eskapizm', icon: '<i class="fa-solid fa-star text-6xl text-pink-500"></i>', bgColor: '#330821', rotation: 3,
                        content: `<p>Mabel'in bitmek bilmeyen iyimserliğinin altında, evrenin entropik kaosuna kafa tutan devasa bir inkar ve "Eskapizm" (Kaçışçılık) kalkanı yatmaktadır.</p><p class="mt-4"><strong>Kozmik Denge:</strong> İnsanlar onu sadece saf bulur; oysa onun fizik kurallarını ve mantıksal nedenselliği sırf onlara inanmadığı için bükebilme yetisi vardır. Eğer Dipper 'Logos' (Mantık) ise, Mabel saf 'Kaos'tur.</p>`,
                        uvs: [{ text: "GERÇEKLİKTEN<br>KAÇAMAZSIN", top: "30%", left: "15%", rot: "-15deg", type: "glow", size: "text-4xl" }, { text: "GÜLÜMSE", top: "70%", left: "50%", rot: "10deg", type: "blood", size: "text-5xl" }]

                        content: `<p>Wendy, kıyamet ve kozmik dehşet karşısında geliştirilen pasif nihilizmin canlı bir örneğidir. Olayların anlamsızlığını kabullenmiş, hayatta kalma içgüdüsünü yoğun bir "apati" (duygusuzluk) ile zırhlamıştır.</p><p class="mt-4">Tuhaf olan her şeye karşı gösterdiği soğukkanlılık bir cesaret belirtisi değil, derin bir vazgeçişin sonucudur. Dünya yansa bile sadece omuz silkecektir.</p>`,
                        uvs: [{ text: "HİÇBİR ŞEYİN<br>ANLAMI YOK", top: "25%", left: "20%", rot: "-5deg", type: "blood", size: "text-3xl" }, { text: "GÜÇLÜ GÖRÜNMEK YORUCU", top: "70%", left: "10%", rot: "8deg", type: "glow", size: "text-2xl" }]

                    },
                    {
                        name: 'Lil\' Gideon', type: 'Bozulmuş Masumiyet', icon: '<i class="fa-solid fa-gem text-6xl text-blue-400"></i>', bgColor: '#0b161c', rotation: 3,
                        content: `<p>Gideon Gleeful, narsisistik kişilik bozukluğunun ve bozulmuş masumiyetin ürkütücü bir portresidir. Gücü manipülasyon üzerine kuruludur ve kozmik güçlerle (Bill Cipher ile) yaptığı anlaşmalar, çocuksu egosunun yarattığı devasa boşluğu doldurma çabasıdır.</p>`,
                        uvs: [{ text: "KÜÇÜK TİRANIN GÜCÜ<br>YALANDAN İBARET", top: "30%", left: "10%", rot: "-12deg", type: "blood", size: "text-3xl" }]
                    },

        let currentPageIndex = 0;

        let lastMouseX = window.innerWidth / 2;
        let lastMouseY = window.innerHeight / 2;

        function updateUVMask() {
            // Arka plan el feneri için global koordinatlar
            document.documentElement.style.setProperty('--mouse-x', `${lastMouseX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${lastMouseY}px`);
            
            // Gizli yazılar için lokal (element içi) koordinat hesabı
            if (isUVActive) {
                document.querySelectorAll('.uv-text').forEach(el => {
                    const rect = el.getBoundingClientRect();
                    const localX = lastMouseX - rect.left;
                    const localY = lastMouseY - rect.top;
                    el.style.setProperty('--mask-x', `${localX}px`);
                    el.style.setProperty('--mask-y', `${localY}px`);
                });
            }
        }

        // Mouse Koordinatları
        document.addEventListener('mousemove', (e) => {
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            updateUVMask();
        });

        // Sayfa kaydırıldığında maskenin kaymasını önlemek için koordinatları tazele
        window.addEventListener('scroll', () => {
            if (isUVActive) updateUVMask();
        });

        // ==========================================
        // 2. KANVAS TOZ PARTİKÜLLERİ SİSTEMİ
        // ==========================================
        const canvas = document.getElementById('dust-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DustParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * -1 - 0.2;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.y < 0) this.y = canvas.height;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < 150; i++) particles.push(new DustParticle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 4. UV SİSTEMİ & 3D TILT EFEKTİ
        // ==========================================
        function toggleUV() {
            isUVActive = !isUVActive;
            document.body.classList.toggle('uv-active', isUVActive);
            
            const icon = document.querySelector('#uv-toggle i');
            if(isUVActive) {
                icon.classList.replace('fa-lightbulb', 'fa-eye');
                icon.classList.add('fa-beat-fade');
                document.body.style.backgroundColor = '#010005';
                updateUVMask(); // Işık açıldığında anında güncelle
            } else {
                icon.classList.replace('fa-eye', 'fa-lightbulb');
                icon.classList.remove('fa-beat-fade');
                document.body.style.backgroundColor = '#030303';
            }
        }

        function bindTiltEffect() {
            const cards = document.querySelectorAll('.tilt-card');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    if(isUVActive) return; // UV açıkken CSS Maskeleme bozulmasın diye 3D iptal.
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -12;
                    const rotateY = ((x - centerX) / centerX) * 12;
                    
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
                    card.style.zIndex = "30";
                });
                
                card.addEventListener('mouseleave', () => {
                    if(isUVActive) return;
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1) rotate(${card.getAttribute('style').includes('rotate') ? card.style.transform.split('rotate(')[1].split(')')[0] : '0deg'})`;
                    card.style.zIndex = "1";
                    card.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
                    setTimeout(() => card.style.transition = 'transform 0.1s ease', 400);
                });
            });
        }

                        <div class="${data.isGlitch ? 'glitch-text text-red-600' : ''}">
                            ${data.icon.replace('text-6xl', 'text-7xl')}
                        </div>
                    </div>
                    <div class="text-center md:text-left mt-4 md:mt-0">
                        <h2 class="text-4xl md:text-6xl font-bold uppercase tracking-wider mb-4" style="font-family: 'Cinzel Decorative'; color: ${isUVActive ? '#00ffff' : '#3a1f0c'}; text-shadow: ${isUVActive ? '0 0 10px #00ffff' : 'none'};">${data.name}</h2>
                        <span class="inline-block bg-red-950 text-red-200 px-5 py-2 text-lg font-bold tracking-widest typewriter shadow-inner">${data.type}</span>
                    </div>

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                overlay.classList.add('opacity-100');
                modal.classList.remove('translate-x-full');
            }, 10);
        }

        function closeModal() {
            document.getElementById('modal').classList.add('translate-x-full');
            document.getElementById('modal-overlay').classList.remove('opacity-100');
            document.getElementById('modal-overlay').classList.add('opacity-0');
            setTimeout(() => { document.getElementById('modal-overlay').classList.add('hidden'); }, 500);
        }

        // ==========================================
        // 6. KRİPTOGRAFİ SİSTEMİ
        // ==========================================
        function processCrypto(action) {
            const input = document.getElementById('crypto-in').value.toUpperCase();
            const type = document.getElementById('cipher-type').value;
            const outBox = document.getElementById('crypto-out');
            
            if(!input) { outBox.value = "[HATA]: Girdi boş olamaz."; return; }

            let result = "";
            let shift = 0;

            if (type.includes('caesar')) {
                shift = type === 'caesar3' ? 3 : -3;
                if (action === 'decode') shift = -shift;
                
                for (let i = 0; i < input.length; i++) {
                    let c = input.charCodeAt(i);
                    if (c >= 65 && c <= 90) {
                        result += String.fromCharCode(((c - 65 + shift + 26) % 26) + 65);
                    } else { result += input.charAt(i); }
                }
            } 
            else if (type === 'atbash') {
                for (let i = 0; i < input.length; i++) {
                    let c = input.charCodeAt(i);
                    if (c >= 65 && c <= 90) { result += String.fromCharCode(90 - (c - 65)); }
                    else { result += input.charAt(i); }
                }
            }

            outBox.value = result;
            outBox.classList.add('glitch-text', 'text-red-500');
            setTimeout(() => { outBox.classList.remove('glitch-text', 'text-red-500'); }, 1000);
        }

        // Klavye Kontrolleri
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            const isJournalOpen = document.getElementById('journal-wrapper').style.display === 'block';
            const isModalClosed = document.getElementById('modal').classList.contains('translate-x-full');
            if (isJournalOpen && isModalClosed && document.activeElement.tagName !== 'TEXTAREA') {
                if (e.key === 'ArrowRight' && currentPageIndex < journalData.length - 1) changePage(1);
                if (e.key === 'ArrowLeft' && currentPageIndex > 0) changePage(-1);
            }
        });
    </script>
